name: Publish game patch (GitHub Pages)
# Every push to main publishes the content patch the app downloads at start-up, plus a browser build at /play/.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tests/run.cjs
      - run: node scripts/patch.cjs
      - run: touch patch-dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with: { path: patch-dist }
      - id: deploy
        uses: actions/deploy-pages@v4
