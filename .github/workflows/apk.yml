name: Build test APK
# Runs when a commit message on main contains [apk], or by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with: { packages: 'platform-tools', log-accepted-android-sdk-licenses: false }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: node tests/run.cjs
      - name: Build APK (patches from GitHub Pages)
        run: gradle :app:assembleDebug --no-daemon -PpatchOrigin=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      - name: Publish APK
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp app/build/outputs/apk/debug/*.apk "DuckWar-${{ github.run_number }}.apk"
          gh release create "build-${{ github.run_number }}" "DuckWar-${{ github.run_number }}.apk" --target "$GITHUB_SHA" --prerelease --title "Duck War build ${{ github.run_number }}" --notes "Test APK. Later updates arrive as content patches; install a new APK only when the app itself changes."
